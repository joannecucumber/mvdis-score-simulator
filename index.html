<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf1f4">
  <title>筆試成績產圖器</title>
  <style>
    :root{--page:#edf1f4;--panel:#fff;--ink:#15202b;--muted:#66717d;--line:#d8dfe5;--soft:#f5f7f9;--blue:#0b97ec;--blue-dark:#087ec8;--danger:#c73d32;--radius:12px;--shadow:0 12px 30px rgb(28 42 54/10%)}
    *{box-sizing:border-box}html{color-scheme:light dark}body{margin:0;min-width:320px;min-height:100vh;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.45}button,input,textarea{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid rgb(11 151 236/32%);outline-offset:2px}
    .app-header{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 18px;border-bottom:1px solid var(--line);background:rgb(255 255 255/88%);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}.brand{min-width:0}.brand h1{margin:0;font-size:19px;line-height:1.2}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.header-actions{display:flex;gap:8px;flex:none}
    .button{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-weight:700;transition:border-color .15s,background .15s,transform .15s}.button:hover{border-color:#9eabb6;background:var(--soft)}.button:active{transform:translateY(1px)}.button.primary{border-color:var(--blue);background:var(--blue);color:#fff}.button.primary:hover{border-color:var(--blue-dark);background:var(--blue-dark)}.button.danger{color:var(--danger)}.button.small{min-height:34px;padding:6px 10px;font-size:13px}.button.icon{width:34px;padding:0}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 404px;min-height:calc(100vh - 66px)}.preview-column{min-width:0;padding:18px;overflow:auto}.preview-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px;color:var(--muted);font-size:12px}.preview-toolbar strong{color:var(--ink)}.preview-meta{font-variant-numeric:tabular-nums}.canvas-shell{width:100%;min-height:240px;overflow:auto;border:1px solid #d0d7dc;border-radius:var(--radius);background:#cfd5da;box-shadow:var(--shadow);color-scheme:only light;forced-color-adjust:none}#resultCanvas{width:100%;height:auto;display:block;background:#fff;color-scheme:only light;forced-color-adjust:none}
    .editor{min-width:0;height:calc(100vh - 66px);overflow:auto;border-left:1px solid var(--line);background:var(--panel);scrollbar-gutter:stable}.editor-inner{padding:17px}.section{padding:0 0 18px;margin:0 0 18px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0;margin-bottom:0}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-heading h2{margin:0;font-size:15px}.count{color:var(--muted);font-size:12px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field.full{grid-column:1/-1}.field label,.field>span{display:block;margin-bottom:5px;color:var(--muted);font-size:12px;font-weight:700}.control{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#15202b}textarea.control{min-height:72px;resize:vertical;line-height:1.45}.control:hover{border-color:#adb8c1}.control:focus{border-color:var(--blue);outline:3px solid rgb(11 151 236/15%)}
    .usage-note{display:grid;gap:3px;margin:0 0 16px;padding:11px 12px;border:1px solid rgb(11 151 236/28%);border-radius:9px;background:rgb(11 151 236/8%);font-size:12px}.usage-note strong{font-size:13px}.usage-note span{color:var(--muted)}.question-list{display:grid;gap:8px}.question-card{border:1px solid var(--line);border-radius:9px;background:var(--soft);overflow:hidden}.question-card-head{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:#fff;cursor:pointer;list-style:none}.question-card-head::-webkit-details-marker{display:none}.question-card-head::after{content:'▾';color:var(--muted);font-size:13px;transition:transform .15s}.question-card[open] .question-card-head{border-bottom:1px solid var(--line)}.question-card[open] .question-card-head::after{transform:rotate(180deg)}.question-summary{min-width:0;display:grid;gap:2px}.question-summary strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.question-summary span{color:var(--muted);font-size:11px}.question-card-body{padding:11px}.question-card .field-grid{gap:9px}.question-card textarea.control{min-height:62px}.image-row{display:flex;align-items:center;gap:8px}.image-row input{min-width:0;font-size:11px}.image-chip{color:var(--muted);font-size:11px}.inline-actions{display:flex;gap:8px;margin-top:10px}.inline-actions .button{flex:1}.paste-help{margin:-2px 0 8px;color:var(--muted);font-size:11px}#bulkInput{min-height:96px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.advanced-tools{padding-bottom:0}.advanced-tools>summary{margin:0 0 18px;padding:1px 0 18px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:800;list-style:none}.advanced-tools>summary::-webkit-details-marker{display:none}.advanced-tools>summary::before{content:'＋';display:inline-block;width:20px;color:var(--blue)}.advanced-tools[open]>summary::before{content:'−'}.advanced-content{padding-bottom:18px}
    .editor-footer{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;bottom:0;padding:12px 17px 16px;border-top:1px solid var(--line);background:rgb(255 255 255/94%);backdrop-filter:blur(10px)}.toast{position:fixed;left:50%;bottom:24px;z-index:50;transform:translate(-50%,20px);padding:10px 14px;border-radius:8px;background:#15202b;color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1100px){.workspace{grid-template-columns:1fr}.editor{height:auto;max-height:none;border-left:0;border-top:1px solid var(--line)}.editor-inner{max-width:760px;margin:0 auto}.editor-footer{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.app-header{align-items:flex-start}.brand p{display:none}.header-actions .button:not(.primary){display:none}.preview-column{padding:10px}.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.editor-inner{padding:14px}.editor-footer{padding:10px 14px 14px}}
    @media(prefers-color-scheme:dark){:root{--page:#15191d;--panel:#20262b;--ink:#f3f5f7;--muted:#aab3bb;--line:#3b454d;--soft:#282f35}.app-header,.question-card-head,.editor-footer{background:rgb(32 38 43/94%)}.control{background:#171c20;color:#f3f5f7}.canvas-shell{border-color:#4a535a;background:#cfd5da}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><h1>筆試成績產圖器</h1><p>左側即時預覽，右側修改內容，匯出固定 1920px PNG</p></div>
    <div class="header-actions"><button class="button" id="resetButton" type="button">重設</button><button class="button primary" id="downloadButton" type="button">下載 PNG</button></div>
  </header>
  <main class="workspace">
    <section class="preview-column" aria-labelledby="previewTitle">
      <div class="preview-toolbar"><span><strong id="previewTitle">成績圖預覽</strong> · 實際輸出不含控制面板</span><span class="preview-meta" id="previewMeta">1920 × 1080 px</span></div>
      <div class="canvas-shell"><canvas id="resultCanvas" width="1920" height="1080" aria-label="筆試成績圖片預覽"></canvas></div>
    </section>
    <aside class="editor" aria-label="成績內容設定">
      <div class="editor-inner">
        <div class="usage-note"><strong>使用方式</strong><span>① 輸入分數與時間　② 檢查預覽　③ 下載 PNG。錯題會依分數自動產生，不必逐題設定。</span></div>
        <section class="section">
          <div class="section-heading"><h2>基本資料</h2><span class="count">即時更新</span></div>
          <div class="field-grid">
            <div class="field full"><label for="candidateName">考生姓名</label><input class="control" id="candidateName" autocomplete="off"></div>
            <div class="field full"><label for="candidateId">證號</label><input class="control" id="candidateId" autocomplete="off"></div>
            <div class="field"><label for="score">分數（每題 2 分）</label><input class="control" id="score" type="number" min="0" max="100" step="2"></div>
            <div class="field"><label for="examTime">時間</label><input class="control" id="examTime" inputmode="numeric" placeholder="00:57"></div>
            <div class="field full"><label for="message">結果文字</label><input class="control" id="message" autocomplete="off"></div>
          </div>
          <div class="inline-actions"><button class="button small" id="copyImage" type="button">複製圖片</button></div>
        </section>
        <section class="section">
          <div class="section-heading"><h2>錯誤題目（自動產生）</h2><span class="count" id="questionCount">1 題</span></div>
          <p class="paste-help">不用設定。每錯 1 題扣 2 分；若要修改內容，再點開其中一題。</p>
          <div class="question-list" id="questionList"></div>
          <div class="inline-actions"><button class="button primary" id="randomQuestions" type="button" onclick="window.randomizeCommonQuestions()">↻ 依分數重抽錯題</button></div>
        </section>
        <details class="section advanced-tools">
          <summary>進階：貼上自己的錯題</summary>
          <div class="advanced-content"><p class="paste-help">每行一題，以 | 分隔：題號｜題目｜選項1｜選項2｜選項3｜考生答案｜標準答案</p><textarea class="control" id="bulkInput" placeholder="3|請選出影片中的視線遮蔽處，可能會有車輛駛出？|人行道上的柱子。|對向車輛的後方。|路旁的停車。|1|2"></textarea><div class="inline-actions"><button class="button" id="importQuestions" type="button">匯入並取代錯題</button></div></div>
        </details>
      </div>
      <footer class="editor-footer"><button class="button" id="copyImageBottom" type="button">複製圖片</button><button class="button primary" id="downloadButtonBottom" type="button">下載 PNG</button></footer>
    </aside>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
  (()=>{'use strict';
    const STORAGE_KEY='mvdis-grade-image-builder-v5',OUTPUT_WIDTH=1920,MIN_OUTPUT_HEIGHT=1080;
    const COMMON_QUESTION_POOL=[
      {no:'4',question:'當開車進入「國道施工路段」時，下列哪一項駕駛行為最能有效預防事故發生？',options:['在施工縮減車道處加速超車。','開啟駕駛輔助系統後便放心地看手機。','提早變換至未施工車道，並保持隨時準備煞車的安全距離與專注力。'],correctAnswer:'3'},
      {no:'5',question:'駕駛配備有 Level 2 等級先進駕駛輔助系統（ADAS）的新車行駛於國道，下列何者正確？',options:['行經施工路段時應主動介入駕駛，而非完全依賴系統。','系統會自動跟車，可以趁機滑手機或閉目養神。','大雨或大霧時交給電腦操作比人工駕駛更安全。'],correctAnswer:'1'},
      {no:'6',question:'下列關於「變換車道」的行為，何者錯誤？',options:['變換車道時應讓直行車先行，並注意安全距離。','在雙白實線上可雙邊變換車道。','顯示方向燈、查看照後鏡並檢查視野死角。'],correctAnswer:'2'},
      {no:'7',question:'駕駛人行駛至交岔路口，其右轉彎方式下列何者正確？',options:['距交岔路口 20 至 40 公尺處才換入慢車道。','距交岔路口 50 公尺前顯示方向燈。','於外側車道右轉彎時，應距交岔路口 30 公尺前顯示方向燈。'],correctAnswer:'3'},
      {no:'8',question:'汽車行駛中變換車道時，若未依規定全程顯示方向燈，其規定為何？',options:['不論一般道路或高速公路，均屬違規行為。','僅行駛於高速公路時才屬違規。','後方無來車時不顯示方向燈亦無罰責。'],correctAnswer:'1'},
      {no:'10',question:'汽車駕駛人於車流中利用空隙頻繁變換車道超車，下列何者正確？',options:['屬合理駕駛行為。','未影響他人即可接受。','不得以迫近、驟然變換車道或其他不當方式迫使他車讓道。'],correctAnswer:'3'},
      {no:'12',question:'關於先進駕駛輔助系統（ADAS），下列敘述何者正確？',options:['開啟系統後可以滑手機或短暫閉眼休息。','系統一定能辨識前方靜止工程車。','屬輔助功能，駕駛人仍應注意前方並主動監控。'],correctAnswer:'3'},
      {no:'14',question:'汽車駕駛人行經路口，遇交通警察指揮與燈號顯示不一致時，應如何行駛？',options:['以燈號顯示為準。','聽從交通警察指揮行駛。','跟隨前車行駛。'],correctAnswer:'2'},
      {no:'15',question:'曾因酒駕遭吊銷駕照，重新考照後必須加裝何種設備於車上始得行駛？',options:['行車紀錄器。','車用滅火器。','車輛點火自動鎖定裝置（酒精鎖）。'],correctAnswer:'3'},
      {no:'16',question:'完成酒駕防制教育或酒癮治療並考驗合格後，酒精鎖的強制使用期間為何？',options:['半年。','1 年。','3 年。'],correctAnswer:'2'},
      {no:'18',question:'汽車駕駛人酒測值超過標準，18 歲以上未滿 70 歲同車乘客無特殊原因時，是否受罰？',options:['同車乘客應受處罰。','同車乘客沒有處罰機制。','乘客沒有飲酒就不受罰。'],correctAnswer:'1'},
      {no:'20',question:'汽車駕駛人酒後駕車初犯，酒精濃度超過法規標準，下列何者正確？',options:['處 1 萬 5 千至 9 萬元罰鍰。','處 3 萬至 12 萬元罰鍰，並吊扣駕照。','僅予警告。'],correctAnswer:'2'},
      {no:'22',question:'駕駛人初次明確拒絕接受酒精濃度測試，其處罰為何？',options:['依酒精濃度決定罰鍰。','處 9 萬元罰鍰並吊扣駕照。','處 18 萬元罰鍰、移置保管車輛並吊銷駕照。'],correctAnswer:'3'},
      {no:'23',question:'駕駛人在幾年內第二次酒駕，會被視為累犯並處最高額罰鍰？',options:['5 年內。','10 年內。','終身計算。'],correctAnswer:'2'},
      {no:'141',question:'用以劃分路面成雙向車道，禁止車輛跨越行駛並不得迴轉的黃色雙實線稱為什麼？',options:['分向限制線。','路面邊線。','禁止變換車道線。'],correctAnswer:'1'},
      {no:'142',question:'汽車在鐵路平交道上熄火且無法發動，警鈴已響、遮斷器開始降下時應如何處理？',options:['留在車內等拖吊車。','持續嘗試發動直到成功。','立即按下緊急鈕並設法推離軌道；火車已近時人員迅速離開。'],correctAnswer:'3'},
      {no:'147',question:'行近平交道時警示燈已亮、警鈴已響，下列何者正確？',options:['可緊跟前車通過。','繼續加速通過。','應在平交道停止線前停車。'],correctAnswer:'3'},
      {no:'148',question:'下列何項在鐵路平交道的行為，可處新臺幣 15,000 元以上 90,000 元以下罰鍰？',options:['未將時速降至 15 公里以下。','在平交道前 10 公尺處停車。','在平交道上超車、迴轉、倒車或臨時停車。'],correctAnswer:'3'},
      {no:'151',question:'汽車行近平交道前，若前車尚未駛離平交道，後車應如何處理？',options:['緊隨前車進入。','停在停止線後方，確認能安全通過後才通過。','按鳴喇叭催促前車。'],correctAnswer:'2'},
      {no:'152',question:'車輛在鐵路平交道上熄火時，緊急應變的正確順序為何？',options:['撥打 119、將車推離、按緊急按鈕。','按緊急按鈕、將車推離、人員儘快離開平交道。','連續鳴喇叭、將車推離、撥打 119。'],correctAnswer:'2'},
      {no:'153',question:'平交道警鈴已響、閃光告警燈已閃爍，但遮斷器尚未放下時應如何處理？',options:['立即加速通過。','在停止線前停下，不得強行進入。','先觀察有無火車再決定。'],correctAnswer:'2'},
      {no:'154',question:'酒後駕車肇事時，強制汽車責任保險公司給付受害人後，法律上如何處理？',options:['不得向酒駕者追償。','可向酒駕者追償已支付的賠償金。','由政府補償保險公司。'],correctAnswer:'2'},
      {no:'156',question:'國道曾發生啟用 ADAS 系統追撞緩撞車事故，下列敘述何者錯誤？',options:['ADAS 具自動駕駛功能，不需駕駛人監督。','系統可能無法正確辨識靜止物。','ADAS 僅為輔助駕駛功能。'],correctAnswer:'1'},
      {no:'158',question:'自 115 年 2 月 28 日起新登檢領照的自用小客車有貼隔熱紙者，前擋風玻璃可見光透過率應為何？',options:['50％以上。','60％以上。','70％以上。'],correctAnswer:'3'},
      {no:'160',question:'汽車行至交岔路口，前方為綠燈，但聽聞緊急車輛警號時應如何處理？',options:['有優先路權，儘速通過。','緊跟前車行駛。','避讓緊急車輛優先通行。'],correctAnswer:'3'},
      {no:'161',question:'國道路肩在特定時段會開放行駛，下列何者錯誤？',options:['為躲避主線塞車，可以隨時切入路肩。','開放路肩終點前應依序切回主線。','未公告開放時，路肩僅供特定緊急或公務車輛通行。'],correctAnswer:'1'},
      {no:'508',question:'汽車行經未劃設行人穿越道的交岔路口，遇有行人穿越時應如何處理？',options:['鳴喇叭示意行人快速通過。','減速並視情況保持距離通過。','無論有無號誌或指揮，均應暫停讓行人先通過。'],correctAnswer:'3'},
      {no:'509',question:'關於閃光紅燈與閃光黃燈的區別，下列何者正確？',options:['閃光紅燈應停車再開；閃光黃燈應減速接近、小心通過。','兩者皆只需放慢油門即可。','閃光黃燈須完全停止；閃光紅燈只需減速。'],correctAnswer:'1'},
      {no:'510',question:'車輛行至無號誌圓環路口時，通行優先順序為何？',options:['右側欲進入圓環的車輛優先。','應讓已在圓環內行駛的車輛先行。','較寬道路駛來的車輛優先。'],correctAnswer:'2'},
      {no:'516',question:'汽車行至無號誌路口，未劃分幹、支線道且車道數相同時，下列敘述何者錯誤？',options:['轉彎車應暫停讓直行車先行。','同為直行或轉彎車時，左方車讓右方車先行。','優先進入路口的車輛先行。'],correctAnswer:'3'}
    ];
    function wrongCountForScore(score){const numeric=Number.parseFloat(score);if(!Number.isFinite(numeric))return 0;return Math.max(0,Math.min(50,Math.round((100-Math.max(0,Math.min(100,numeric)))/2)))}
    function makeRandomQuestions(count=5,excluded=[]){const excludedQuestions=new Set(excluded.map(item=>String(item.question||''))),usedPositions=new Set(excluded.map(item=>Number.parseInt(item.no,10)).filter(no=>no>=1&&no<=50)),fresh=COMMON_QUESTION_POOL.filter(item=>!excludedQuestions.has(item.question)),fallback=COMMON_QUESTION_POOL.filter(item=>excludedQuestions.has(item.question)),result=[];const shuffleItems=items=>{const copy=items.map(item=>({...item,options:[...item.options]}));for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};let candidates=shuffleItems(fresh);while(result.length<count){if(!candidates.length)candidates=shuffleItems(fallback.length?fallback:COMMON_QUESTION_POOL);const item=candidates.shift();if(!item)break;const wrong=['1','2','3'].filter(answer=>answer!==item.correctAnswer);result.push({...item,candidateAnswer:wrong[Math.floor(Math.random()*wrong.length)],image:''})}const positions=Array.from({length:50},(_,index)=>index+1).filter(no=>!usedPositions.has(no));for(let i=positions.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[positions[i],positions[j]]=[positions[j],positions[i]]}const chosenPositions=positions.slice(0,result.length).sort((a,b)=>a-b);return result.map((item,index)=>({...item,no:String(chosenPositions[index])}))}
    const defaultState={candidateName:'王○○',candidateId:'Z000000000',score:'90.0',time:'00:57',message:'恭喜您通過考試！',questions:makeRandomQuestions(wrongCountForScore('90.0'))};
    const canvas=document.getElementById('resultCanvas'),ctx=canvas.getContext('2d'),previewMeta=document.getElementById('previewMeta'),questionList=document.getElementById('questionList'),questionCount=document.getElementById('questionCount'),toast=document.getElementById('toast'),imageCache=new Map();let toastTimer=0,renderFrame=0,saveTimer=0;

    function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}

    function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}

    function syncQuestionsToScore({reshuffle=false}={}){const target=wrongCountForScore(state.score);if(reshuffle)state.questions=makeRandomQuestions(target);else if(state.questions.length>target)state.questions=state.questions.slice(0,target);else if(state.questions.length<target)state.questions.push(...makeRandomQuestions(target-state.questions.length,state.questions));state.message=Number.parseFloat(state.score)>=85?'恭喜您通過考試！':'很可惜，您未通過考試！';const messageInput=document.getElementById('message');if(messageInput)messageInput.value=state.message;renderQuestionEditor();saveState();scheduleDraw()}
    function bindTopInputs(){const bindings={candidateName:'candidateName',candidateId:'candidateId',examTime:'time',message:'message'};for(const[id,key]of Object.entries(bindings)){const input=document.getElementById(id);input.value=state[key];input.addEventListener('input',()=>{state[key]=input.value;saveState();scheduleDraw()})}const scoreInput=document.getElementById('score');scoreInput.value=state.score;let scoreSyncTimer=0;scoreInput.addEventListener('input',()=>{state.score=scoreInput.value;clearTimeout(scoreSyncTimer);scoreSyncTimer=setTimeout(()=>syncQuestionsToScore(),120)});scoreInput.addEventListener('change',()=>{clearTimeout(scoreSyncTimer);state.score=scoreInput.value;syncQuestionsToScore()});document.getElementById('examTime').addEventListener('blur',event=>{const digits=event.target.value.replace(/\D/g,'').slice(-4).padStart(4,'0');event.target.value=`${digits.slice(0,2)}:${digits.slice(2)}`;state.time=event.target.value;saveState();scheduleDraw()})}
    function renderQuestionEditor(){questionCount.textContent=`${state.questions.length} 題`;questionList.innerHTML=state.questions.map((raw,index)=>{const q=normalizedQuestion(raw),imageStatus=q.image?'已加入題圖':'未加入題圖',shortQuestion=q.question||'尚未輸入題目';return `<details class="question-card" data-index="${index}"><summary class="question-card-head"><span class="question-summary"><strong>錯題 ${index+1}・第 ${escapeHtml(q.no)} 題　${escapeHtml(shortQuestion)}</strong><span>考生答案 ${escapeHtml(q.candidateAnswer)}　→　標準答案 ${escapeHtml(q.correctAnswer)}</span></span></summary><div class="question-card-body"><div class="field-grid"><div class="field"><label>題號</label><input class="control" data-key="no" value="${escapeHtml(q.no)}"></div><div class="field"><label>考生／標準答案</label><div class="field-grid"><input class="control" data-key="candidateAnswer" value="${escapeHtml(q.candidateAnswer)}" aria-label="考生答案"><input class="control" data-key="correctAnswer" value="${escapeHtml(q.correctAnswer)}" aria-label="標準答案"></div></div><div class="field full"><label>題目</label><textarea class="control" data-key="question">${escapeHtml(q.question)}</textarea></div>${q.options.map((option,i)=>`<div class="field full"><label>選項 ${i+1}</label><textarea class="control" data-option="${i}">${escapeHtml(option)}</textarea></div>`).join('')}<div class="field full"><span>題目圖片（選填）</span><div class="image-row"><input type="file" accept="image/*" data-image-input aria-label="上傳題圖"><span class="image-chip">${imageStatus}</span>${q.image?'<button class="button small danger" type="button" data-action="remove-image">移除</button>':''}</div></div></div></div></details>`}).join('')}
    questionList.addEventListener('input',event=>{const card=event.target.closest('.question-card');if(!card)return;const q=state.questions[Number(card.dataset.index)];if(!q)return;if(event.target.dataset.key)q[event.target.dataset.key]=event.target.value;if(event.target.dataset.option!==undefined)q.options[Number(event.target.dataset.option)]=event.target.value;saveState();scheduleDraw()});
    questionList.addEventListener('change',event=>{if(!event.target.matches('[data-image-input]'))return;const index=Number(event.target.closest('.question-card').dataset.index),file=event.target.files&&event.target.files[0];if(!file)return;const reader=new FileReader();reader.addEventListener('load',()=>{state.questions[index].image=String(reader.result);renderQuestionEditor();saveState();scheduleDraw()});reader.readAsDataURL(file)});
    questionList.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const card=button.closest('.question-card'),index=Number(card.dataset.index),action=button.dataset.action;if(action==='remove')state.questions.splice(index,1);if(action==='duplicate')state.questions.splice(index+1,0,normalizedQuestion(state.questions[index]));if(action==='up'&&index>0)[state.questions[index-1],state.questions[index]]=[state.questions[index],state.questions[index-1]];if(action==='remove-image')state.questions[index].image='';renderQuestionEditor();saveState();scheduleDraw()});
    function textLines(context,text,maxWidth){const paragraphs=String(text??'').replaceAll('\r','').split('\n'),lines=[];for(const paragraph of paragraphs){if(!paragraph){lines.push('');continue}let line='';for(const character of Array.from(paragraph)){const candidate=line+character;if(line&&context.measureText(candidate).width>maxWidth){lines.push(line);line=character}else line=candidate}if(line)lines.push(line)}return lines.length?lines:['']}
    function drawWrapped(context,lines,x,y,lineHeight){lines.forEach((line,index)=>context.fillText(line,x,y+index*lineHeight))}
    function roundedRectPath(context,x,y,width,height,radius){const r=Math.min(radius,width/2,height/2);context.beginPath();context.moveTo(x+r,y);context.arcTo(x+width,y,x+width,y+height,r);context.arcTo(x+width,y+height,x,y+height,r);context.arcTo(x,y+height,x,y,r);context.arcTo(x,y,x+width,y,r);context.closePath()}
    function getImage(source){if(!source)return null;if(imageCache.has(source))return imageCache.get(source);const image=new Image();image.decoding='async';image.addEventListener('load',scheduleDraw,{once:true});image.src=source;imageCache.set(source,image);return image}
    function calculateRows(context){const questionCellWidth=1414;return state.questions.map(raw=>{const question=normalizedQuestion(raw),hasImage=Boolean(question.image),textWidth=hasImage?questionCellWidth-375:questionCellWidth-86;context.font='30px "PingFang TC","Microsoft JhengHei",sans-serif';const questionLines=textLines(context,question.question,textWidth);context.font='29px "PingFang TC","Microsoft JhengHei",sans-serif';const optionLines=question.options.map(option=>textLines(context,option,textWidth-82)),textHeight=questionLines.length*40+24+optionLines.reduce((sum,lines)=>sum+Math.max(1,lines.length)*39+18,0)+24,height=Math.max(hasImage?276:246,textHeight);return{question,questionLines,optionLines,hasImage,height}})}
    function drawSummary(context){const x=38,y=28,width=1844,height=296;context.fillStyle='#fff';context.fillRect(x,y,width,height);context.strokeStyle='#d2d2d2';context.lineWidth=1.5;context.strokeRect(x,y,width,height);context.fillStyle='#111';context.textBaseline='alphabetic';context.textAlign='left';context.font='42px "PingFang TC","Microsoft JhengHei",sans-serif';context.fillText(`考生：${state.candidateName||''} (${state.candidateId||''})`,66,112);const bx=1284,by=74,bw=266,bh=66;context.save();context.shadowColor='rgba(0,0,0,.22)';context.shadowBlur=8;context.shadowOffsetY=3;roundedRectPath(context,bx,by,bw,bh,5);context.fillStyle='#0799ee';context.fill();context.restore();context.fillStyle='#fff';context.textAlign='center';context.font='44px "PingFang TC","Microsoft JhengHei",sans-serif';context.fillText('回考試首頁',bx+bw/2,124);context.fillStyle='#111';context.textAlign='left';context.font='400 42px "Helvetica Neue",Arial,sans-serif';context.fillText(state.time||'00:00',1554,122);context.textAlign='center';context.font='42px "PingFang TC","Microsoft JhengHei",sans-serif';context.fillText('考試成績',620,182);const numericScore=Number.parseFloat(state.score);context.fillStyle=Number.isFinite(numericScore)&&numericScore>=85?'#00a600':'#d32222';context.font='300 92px "Helvetica Neue",Arial,sans-serif';const scoreText=state.score===''?'0.0':String(state.score);context.fillText(scoreText.includes('.')?scoreText:`${scoreText}.0`,620,286);context.fillStyle='#001dff';context.font='40px "PingFang TC","Microsoft JhengHei",sans-serif';context.fillText(state.message||'',1122,246)}
    function drawTable(context,rows){const x=60,y=350,width=1800,headerHeight=66,numberWidth=102,answerWidth=142,standardWidth=142,questionWidth=width-numberWidth-answerWidth-standardWidth,questionX=x+numberWidth,candidateX=questionX+questionWidth,standardX=candidateX+answerWidth;context.fillStyle='#0997ec';context.fillRect(x,y,width,headerHeight);context.strokeStyle='#0879c9';context.lineWidth=1.2;[x,questionX,candidateX,standardX,x+width].forEach(lineX=>{context.beginPath();context.moveTo(lineX,y);context.lineTo(lineX,y+headerHeight);context.stroke()});context.fillStyle='#fff';context.font='700 24px "PingFang TC","Microsoft JhengHei",sans-serif';context.textBaseline='middle';context.textAlign='center';context.fillText('#',x+numberWidth/2,y+headerHeight/2+1);context.textAlign='left';context.fillText('題目',questionX+24,y+headerHeight/2+1);context.textAlign='center';context.fillText('考生答案',candidateX+answerWidth/2,y+headerHeight/2+1);context.fillText('標準答案',standardX+standardWidth/2,y+headerHeight/2+1);let rowY=y+headerHeight;rows.forEach(row=>{const{question,questionLines,optionLines,hasImage,height}=row,textX=hasImage?questionX+340:questionX+38,optionX=textX+24,textMaxX=candidateX-34;context.fillStyle='#fff';context.fillRect(x,rowY,width,height);context.strokeStyle='#e0e0e0';context.lineWidth=1;context.strokeRect(x,rowY,width,height);context.fillStyle='#171717';context.textBaseline='middle';context.textAlign='center';context.font='28px "Times New Roman","Songti TC","PMingLiU",serif';context.fillText(question.no,x+numberWidth/2,rowY+height/2);context.fillText(question.candidateAnswer,candidateX+answerWidth/2,rowY+height/2);context.fillText(question.correctAnswer,standardX+standardWidth/2,rowY+height/2);if(hasImage){const image=getImage(question.image);if(image&&image.complete&&image.naturalWidth){const maxW=270,maxH=Math.min(190,height-50),scale=Math.min(maxW/image.naturalWidth,maxH/image.naturalHeight,1.4),drawW=image.naturalWidth*scale,drawH=image.naturalHeight*sca     function draw(){renderFrame=0;canvas.width=OUTPUT_WIDTH;canvas.height=MIN_OUTPUT_HEIGHT;const rows=calculateRows(ctx),contentHeight=350+66+rows.reduce((sum,row)=>sum+row.height,0)+36,outputHeight=Math.max(MIN_OUTPUT_HEIGHT,Math.ceil(contentHeight));if(canvas.height!==outputHeight)canvas.height=outputHeight;ctx.fillStyle='#f8fafb';ctx.fillRect(0,0,canvas.width,canvas.height);drawSummary(ctx);drawTable(ctx,rows);previewMeta.textContent=`${canvas.width} × ${canvas.height} px`}
    function scheduleDraw(){if(!renderFrame)renderFrame=requestAnimationFrame(draw)}
    async function downloadImage(){draw();const safeScore=String(state.score||'0').replace(/[^0-9.]/g,''),blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob){showToast('圖片產生失敗，請重試');return}const link=document.createElement('a'),url=URL.createObjectURL(blob);link.download=`筆試成績-${safeScore||'0'}分.png`;link.href=url;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('PNG 已下載')}

    function importQuestions(){const source=document.getElementById('bulkInput').value.trim();if(!source){showToast('請先貼上錯題資料');return}const imported=source.split('\n').map(line=>line.split('|').map(item=>item.trim())).filter(parts=>parts.length>=7).map(parts=>({no:parts[0],question:parts[1],options:[parts[2],parts[3],parts[4]],candidateAnswer:parts[5],correctAnswer:parts[6],image:''}));if(!imported.length){showToast('格式不符，請確認每行有 7 個欄位');return}state.questions=imported;syncQuestionsToScore();showToast(`已依 ${state.score||0} 分保留 ${state.questions.length} 題錯題`)}

    document.getElementById('importQuestions').addEventListener('click',importQuestions);document.getElementById('resetButton').addEventListener('click',()=>{if(!confirm('要清除目前內容並恢復 90 分、5 題錯題嗎？'))return;state=cloneDefault();localStorage.removeItem(STORAGE_KEY);['candidateName','candidateId','score','examTime','message'].forEach(id=>{const key=id==='examTime'?'time':id;document.getElementById(id).value=state[key]});renderQuestionEditor();saveState();scheduleDraw()});
